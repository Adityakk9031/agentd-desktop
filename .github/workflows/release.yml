# Publishes a release when a version tag is pushed:
#   1. set the version in agentd/__init__.py (e.g. __version__ = "0.2.0")
#   2. git tag v0.2.0 && git push origin v0.2.0
# Installed apps see the new release and offer "Update now".
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag must match the code's version
        run: |
          code_version=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('agentd/__init__.py').read()).group(1))")
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$code_version" != "$tag_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match __version__ $code_version" >&2
            exit 1
          fi

      - name: Run the tests
        run: |
          python -m pip install -e ".[dev,xai,openai,google]"
          python -m pytest -q tests   # browser tests skip themselves when no browser is installed

      - name: Build the wheel
        run: |
          python -m pip install build
          python -m build

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
